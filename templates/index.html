<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smoking Detection System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #222;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 900px;
            padding: 30px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
            color: #222;
            font-size: 23px;
            font-weight: 600;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 25px;
            justify-content: center;
        }

        .tab-btn {
            padding: 10px 20px;
            border: 1px solid #ddd;
            background: white;
            color: #555;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }

        .tab-btn.active,
        .tab-btn:hover {
            background: #222;
            color: white;
            border-color: #222;
        }

        .tab-content {
            display: none;
            margin-bottom: 20px;
            text-align: center;
        }

        .tab-content.active {
            display: block;
        }

        /* Image Upload Placeholder */
        .upload-box {
            border: 2px dashed #d1d5db;
            border-radius: 8px;
            padding: 30px 15px;
            margin-bottom: 18px;
            background: #fafafa;
            cursor: pointer;
            transition: 0.2s;
            display: block;
        }

        .upload-box:hover {
            border-color: #888;
            background: #f5f5f5;
        }

        .upload-box p {
            color: #555;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .upload-box small {
            color: #999;
            font-size: 12px;
        }

        /* Center File Input */
        input[type="file"] {
            display: block;
            margin: 15px auto;
            max-width: 100%;
        }

        /* Action Buttons */
        button.action-btn {
            background: #222;
            color: white;
            border: none;
            padding: 11px 22px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            margin: 10px auto;
        }

        button.action-btn:hover {
            background: #444;
        }

        /* Center Image and Video Preview */
        .preview {
            max-width: 100%;
            max-height: 350px;
            width: auto;
            border-radius: 8px;
            margin: 15px auto;
            display: none;
            object-fit: contain;
        }

        #webcam {
            width: 100%;
            max-height: 350px;
            border-radius: 8px;
            background: #000;
            display: none;
            margin: 15px auto;
        }

        /* Result Alerts */
        .alert-box {
            display: none;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 16px;
            font-weight: 600;
        }

        .alert-smoking {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .alert-safe {
            background: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        .spinner {
            display: none;
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Smoking Detection System</h1>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('image')">
                Image
            </button>

            <button class="tab-btn" onclick="switchTab('video')">
                Video
            </button>

            <button class="tab-btn" onclick="switchTab('camera')">
                Camera
            </button>
        </div>

        <!-- Image Tab -->
        <div id="image-tab" class="tab-content active">

            <label class="upload-box" for="image-input">
                <p>Upload an Image</p>
                <small>Select an image to analyze</small>
            </label>

            <input type="file" id="image-input" accept="image/*" onchange="previewFile(this, 'img-preview')">

            <img id="img-preview" class="preview" alt="Image Preview">

            <br>

            <button class="action-btn" onclick="uploadImage()">
                Check Image
            </button>

        </div>

        <!-- Video Tab -->
        <div id="video-tab" class="tab-content">

            <input type="file" id="video-input" accept="video/*" onchange="previewFile(this, 'video-preview')">

            <video id="video-preview" class="preview" controls>
            </video>

            <br>

            <button class="action-btn" onclick="uploadVideo()">
                Check Video
            </button>

        </div>

        <!-- Camera Tab -->
        <div id="camera-tab" class="tab-content">

            <video id="webcam" autoplay playsinline></video>

            <br>

            <button class="action-btn" id="start-cam-btn" onclick="startCamera()">
                Start Camera
            </button>

            <button class="action-btn" id="snap-cam-btn" style="display:none;" onclick="captureAndCheck()">
                Check Current Frame
            </button>

            <button class="action-btn" id="stop-cam-btn" style="display:none; background:#dc3545;"
                onclick="stopCamera()">
                Stop Camera
            </button>

        </div>

        <!-- Loading -->
        <div id="spinner" class="spinner">
            Analyzing frame with CNN...
        </div>

        <!-- Detection Result -->
        <div id="alert-box" class="alert-box"></div>

    </div>

    <script>

        let stream = null;

        // Switch Tabs
        function switchTab(tab) {

            document.querySelectorAll('.tab-btn').forEach(btn =>
                btn.classList.remove('active')
            );

            document.querySelectorAll('.tab-content').forEach(tc =>
                tc.classList.remove('active')
            );

            hideAlert();

            if (tab === 'image') {

                document.querySelector("button[onclick=\"switchTab('image')\"]")
                    .classList.add('active');

                document.getElementById('image-tab').classList.add('active');

                stopCamera();

            } else if (tab === 'video') {

                document.querySelector("button[onclick=\"switchTab('video')\"]")
                    .classList.add('active');

                document.getElementById('video-tab').classList.add('active');

                stopCamera();

            } else if (tab === 'camera') {

                document.querySelector("button[onclick=\"switchTab('camera')\"]")
                    .classList.add('active');

                document.getElementById('camera-tab').classList.add('active');

            }
        }

        // Preview Uploaded File
        function previewFile(input, previewId) {

            const file = input.files[0];

            const preview = document.getElementById(previewId);

            if (file) {

                preview.src = URL.createObjectURL(file);

                preview.style.display = 'block';

                hideAlert();
            }
        }

        // Show Detection Result
        function showAlert(label, conf) {

            const box = document.getElementById('alert-box');

            document.getElementById('spinner').style.display = 'none';

            box.style.display = 'block';

            if (label === 'Smoking') {

                box.className = 'alert-box alert-smoking';

                box.innerHTML = `
                ALERT: Smoking Detected!
                <br>
                <small style="font-size:14px;font-weight:normal;">
                    Confidence: ${conf}%
                </small>
            `;

            } else {

                box.className = 'alert-box alert-safe';

                box.innerHTML = `
                SAFE: Not Smoking
                <br>
                <small style="font-size:14px;font-weight:normal;">
                    Confidence: ${conf}%
                </small>
            `;
            }
        }

        // Hide Detection Result
        function hideAlert() {

            document.getElementById('alert-box').style.display = 'none';

            document.getElementById('spinner').style.display = 'none';
        }

        // 1. Upload Image
        async function uploadImage() {

            const fileInput = document.getElementById('image-input');

            if (!fileInput.files[0])
                return alert('Please select an image file first.');

            const formData = new FormData();

            formData.append('file', fileInput.files[0]);

            document.getElementById('spinner').style.display = 'block';

            const res = await fetch('/predict_image', {
                method: 'POST',
                body: formData
            });

            const data = await res.json();

            showAlert(data.label, data.confidence);
        }

        // 2. Upload Video
        async function uploadVideo() {

            const fileInput = document.getElementById('video-input');

            if (!fileInput.files[0])
                return alert('Please select a video file first.');

            const formData = new FormData();

            formData.append('file', fileInput.files[0]);

            document.getElementById('spinner').style.display = 'block';

            const res = await fetch('/predict_video', {
                method: 'POST',
                body: formData
            });

            const data = await res.json();

            showAlert(data.label, data.confidence);
        }

        // 3. Start Camera
        async function startCamera() {

            try {

                stream = await navigator.mediaDevices.getUserMedia({
                    video: true
                });

                const video = document.getElementById('webcam');

                video.srcObject = stream;

                video.style.display = 'block';

                document.getElementById('start-cam-btn').style.display = 'none';

                document.getElementById('snap-cam-btn').style.display = 'inline-block';

                document.getElementById('stop-cam-btn').style.display = 'inline-block';

                hideAlert();

            } catch (err) {

                alert('Could not access camera: ' + err.message);
            }
        }

        // Stop Camera
        function stopCamera() {

            if (stream) {

                stream.getTracks().forEach(track => track.stop());

                stream = null;
            }

            document.getElementById('webcam').style.display = 'none';

            document.getElementById('start-cam-btn').style.display = 'inline-block';

            document.getElementById('snap-cam-btn').style.display = 'none';

            document.getElementById('stop-cam-btn').style.display = 'none';
        }

        // 4. Capture and Check Camera Frame
        async function captureAndCheck() {

            const video = document.getElementById('webcam');

            const canvas = document.createElement('canvas');

            canvas.width = video.videoWidth || 640;

            canvas.height = video.videoHeight || 480;

            const ctx = canvas.getContext('2d');

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const dataUrl = canvas.toDataURL('image/jpeg');

            document.getElementById('spinner').style.display = 'block';

            const res = await fetch('/predict_camera', {

                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({
                    image: dataUrl
                })
            });

            const data = await res.json();

            showAlert(data.label, data.confidence);
        }

    </script>

</body>

</html>
